name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Foss Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create persistent debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/persistent-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          METROLIST_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-foss-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
